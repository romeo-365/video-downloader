<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Video Downloader | Pro</title>
    <!-- Link to FontAwesome for Professional Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-dark: #2d3748;
            --text-light: #a0aec0;
            --accent-color: #ff4b5c;
            --accent-hover: #e64353;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: var(--primary-gradient);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-dark);
        }

        .main-container {
            width: 90%;
            max-width: 480px;
            padding: 40px 30px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
            margin: 0 0 10px 0;
            font-weight: 800;
        }

        header p {
            font-size: 1rem;
            opacity: 0.9;
            margin: 0;
            font-weight: 400;
        }

        .platform-tabs {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 30px;
        }

        .tab-button {
            flex: 1;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid transparent;
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        .tab-button:hover, .tab-button.active {
            background: var(--card-bg);
            color: var(--text-dark);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .tab-button i {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .tab-button span {
            font-size: 0.9rem;
            font-weight: 600;
        }
        
        /* Specific colors on hover */
        .tab-button[data-platform="tiktok"]:hover { color: #000000; border-color: #000000;}
        .tab-button[data-platform="youtube"]:hover { color: #FF0000; border-color: #FF0000;}
        .tab-button[data-platform="instagram"]:hover { color: #E1306C; border-color: #E1306C;}

        .download-box {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            display: none; /* Initially hidden */
            animation: fadeIn 0.5s ease;
        }

        .download-box.active {
            display: block;
        }

        .download-box h2 {
            font-size: 1.5rem;
            margin: 0 0 20px 0;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 18px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #764ba2;
        }

        .fetch-button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fetch-button:hover {
            background: var(--accent-hover);
        }

        /* Footer */
        footer {
            margin-top: 50px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.8rem;
            text-align: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Responsive adjustments */
        @media (max-width: 420px) {
            header h1 { font-size: 2rem; }
            .tab-button i { font-size: 1.5rem; }
            .tab-button span { font-size: 0.8rem; }
            .input-group { flex-direction: column; }
            .fetch-button { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="main-container">
        <header>
            <h1>All-in-One Video Downloader</h1>
            <p>Download videos from your favorite platforms</p>
        </header>

        <nav class="platform-tabs">
            <a href="#" class="tab-button active" onclick="showDownloader('tiktok')" data-platform="tiktok">
                <i class="fab fa-tiktok"></i>
                <span>TikTok</span>
            </a>
            <a href="#" class="tab-button" onclick="showDownloader('youtube')" data-platform="youtube">
                <i class="fab fa-youtube"></i>
                <span>YouTube</span>
            </a>
            <a href="#" class="tab-button" onclick="showDownloader('instagram')" data-platform="instagram">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>
        </nav>

        <div id="tiktok-box" class="download-box active">
            <h2><i class="fab fa-tiktok" style="color: #000000;"></i> TikTok Downloader</h2>
            <div class="input-group">
                <input type="text" placeholder="Paste TikTok link here (e.g., vm.tiktok.com/...)">
                <button class="fetch-button">Fetch</button>
            </div>
        </div>

        <div id="youtube-box" class="download-box">
            <h2><i class="fab fa-youtube" style="color: #FF0000;"></i> YouTube Downloader</h2>
            <div class="input-group">
                <input type="text" placeholder="Paste YouTube link here (e.g., youtu.be/...)">
                <button class="fetch-button">Fetch</button>
            </div>
        </div>

        <div id="instagram-box" class="download-box">
            <h2><i class="fab fa-instagram" style="color: #E1306C;"></i> Instagram Downloader</h2>
            <div class="input-group">
                <input type="text" placeholder="Paste Instagram link here (Reel/Photo/TV)">
                <button class="fetch-button">Fetch</button>
            </div>
        </div>
        
        <footer>
            Powered by Pro Downloader Services | © 2023
        </footer>

    </div>

    <script>
        function showDownloader(platform) {
            // Hide all download boxes
            const boxes = document.querySelectorAll('.download-box');
            boxes.forEach(box => box.classList.remove('active'));

            // Deactivate all tabs
            const tabs = document.querySelectorAll('.tab-button');
            tabs.forEach(tab => tab.classList.remove('active'));

            // Show the selected box and activate the tab
            document.getElementById(`${platform}-box`).classList.add('active');
            event.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
