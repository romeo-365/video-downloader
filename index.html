<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Platform Video Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        header {
            text-align: center;
            margin: 30px 0;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        .tabs {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }
        .tab-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active, .tab-btn:hover {
            background: #fff;
            color: #764ba2;
        }
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            display: none;
        }
        .card.active {
            display: block;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
        }
        button.action-btn {
            background: #ff7675;
            border: none;
            padding: 12px 20px;
            color: white;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        button.action-btn:hover {
            background: #d63031;
        }
        .options-container {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }
        .options-container h3 {
            margin-bottom: 15px;
            font-size: 1.2rem;
        }
        .option-btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: 0.2s;
        }
        .option-btn:hover {
            background: #74b9ff;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <header>
        <h1>All-in-One Video Downloader</h1>
        <p>Download videos from TikTok, YouTube, and Instagram instantly</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tiktok', this)">🎵 TikTok</button>
        <button class="tab-btn" onclick="switchTab('youtube', this)">▶️ YouTube</button>
        <button class="tab-btn" onclick="switchTab('instagram', this)">📸 Instagram</button>
    </div>

    <div id="tiktok" class="card active">
        <h2>TikTok Downloader</h2>
        <div class="input-group" style="margin-top: 15px;">
            <input type="text" id="tiktok-input" placeholder="Paste TikTok link here...">
            <button class="action-btn" onclick="processLink('tiktok')">Fetch</button>
        </div>
        <div id="tiktok-options" class="options-container">
            <h3>Choose Download Option:</h3>
            <button class="option-btn" onclick="alert('Downloading MP3...')">🎵 Download MP3</button>
            <button class="option-btn" onclick="alert('Downloading without Watermark...')">📥 Download without Watermark</button>
            <button class="option-btn" onclick="alert('Downloading in HD...')">✨ Download in HD without Watermark</button>
        </div>
    </div>

    <div id="youtube" class="card">
        <h2>YouTube Downloader</h2>
        <div class="input-group" style="margin-top: 15px;">
            <input type="text" id="youtube-input" placeholder="Paste YouTube link here...">
            <button class="action-btn" onclick="processLink('youtube')">Fetch</button>
        </div>
        <div id="youtube-options" class="options-container">
            <h3>Choose Resolution / Format:</h3>
            <button class="option-btn" onclick="alert('Downloading MP3...')">🎵 MP3</button>
            <button class="option-btn" onclick="alert('Downloading 360p...')">📱 360p</button>
            <button class="option-btn" onclick="alert('Downloading 480p...')">💻 480p</button>
            <button class="option-btn" onclick="alert('Downloading 720p...')">📺 720p (HD)</button>
            <button class="option-btn" onclick="alert('Downloading 1080p...')">🖥️ 1080p (Full HD)</button>
            <button class="option-btn" onclick="alert('Downloading 2K...')">🔥 2K</button>
            <button class="option-btn" onclick="alert('Downloading 4K...')">⚡ 4K Ultra HD</button>
        </div>
    </div>

    <div id="instagram" class="card">
        <h2>Instagram Reels / Video Downloader</h2>
        <div class="input-group" style="margin-top: 15px;">
            <input type="text" id="instagram-input" placeholder="Paste Instagram link here...">
            <button class="action-btn" onclick="processLink('instagram')">Fetch</button>
        </div>
        <div id="instagram-options" class="options-container">
            <h3>Choose Download Option:</h3>
            <button class="option-btn" onclick="alert('Downloading MP3...')">🎵 Download MP3</button>
            <button class="option-btn" onclick="alert('Downloading without Watermark...')">📥 Download without Watermark</button>
            <button class="option-btn" onclick="alert('Downloading in HD...')">✨ Download in HD without Watermark</button>
        </div>
    </div>

    <script>
        function switchTab(platform, btn) {
            // Hide all cards
            document.querySelectorAll('.card').forEach(card => card.classList.remove('active'));
            // Remove active class from all buttons
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            // Show selected card and activate button
            document.getElementById(platform).classList.add('active');
            btn.classList.add('active');
        }

        function processLink(platform) {
            const inputVal = document.getElementById(`${platform}-input`).value;
            const optionsDiv = document.getElementById(`${platform}-options`);
            
            if(inputVal.trim() === "") {
                alert("Pehlay link paste karein!");
                return;
            }
            // Yahan options show ho jayenge
            optionsDiv.style.display = 'block';
        }
    </script>
</body>
</html>
